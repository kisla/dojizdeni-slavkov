name: On-demand measurement

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run measurement
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: python3 track_delays.py
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dojizdeni_log_rijen2026.csv latest_status.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "On-demand measurement (dashboard)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push rejected, retrying ($i)..."
            sleep 3
          done
