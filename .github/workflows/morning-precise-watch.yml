name: Morning precise watch

on:
  # No `schedule:` trigger here on purpose. GitHub's native cron on this repo fires
  # ~7h late every day (confirmed 2026-10-12: intended 04:25 UTC, actually fired
  # 11:09-11:38 UTC daily) - by then this job's own HARD_CAP_LOCAL_TIME guard makes
  # it a silent no-op anyway, so a schedule: entry here would only be dead weight.
  # Reliable triggering is instead handled by a separate Claude routine ("Dojizdeni
  # Slavkov - reliable morning trigger", weekday cron 04:20 UTC) that calls
  # `gh workflow run morning-precise-watch.yml` directly - workflow_dispatch isn't
  # subject to the same scheduling delay as schedule: events.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run precise morning watch
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 precise_morning_watch.py
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dojizdeni_log_rijen2026.csv latest_status.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Morning precise watch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push rejected, retrying ($i)..."
            sleep 3
          done
